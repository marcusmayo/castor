# The core this config needs. 3 = taking from the shared skill inventory. A vendored core that
# reads less REFUSES AT BOOT rather than accepting this file and mounting an agent silently
# missing every skill it takes.
contract: 3
# Castor skill/pipeline registry -- VALUES only. The invocation MECHANISM (auth, spawn,
# timeout, error shape, record-to-state) is fleet-core scripts/skills.js. record: persists
# each result to state/compliance/<record>.json for the /compliance-report skill to read.
# TAKEN FROM THE SHARED INVENTORY (fleet-core scripts/skills-inventory.yaml, hash-verified by
# verify-core). These nine were carried here AND in the other profile, byte-identical -- two
# copies of one definition is one definition that can drift. Naming them takes the shared
# definition unmodified; there is no override, and defining any of them below as well is
# refused at boot. contract: 3 is required to take: an older vendored core reads up to 2 and
# must REFUSE this file rather than accept it and mount without these nine.
inventory:
  - /run-audit-verify
  - /run-check-auth
  - /run-check-backup
  - /run-check-net
  - /run-check-pause
  - /run-check-pii
  - /run-check-secrets
  - /run-check-vuln
  - /run-scan-tree

skills:
  - route: /queue
    bin: node
    args: [scripts/queue.js]
    timeout: 15000
    category: Intake
  - route: /queue-clear
    bin: node
    args: [scripts/queue.js, archive, --all]
    timeout: 20000
    category: Intake
  - route: /run-capability-status
    bin: node
    args: [scripts/setup-wizard.js, --status]
    timeout: 30000
    record: capability-status
    category: Governance
