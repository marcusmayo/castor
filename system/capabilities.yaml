# Capability registry — declarative source of truth for optional integrations.
#
# The setup walkthrough (scripts/setup-wizard.js) reads this file and records the
# operator's choice per capability in state/capabilities.json (gitignored).
# Scripts call requireCapability(id) from scripts/capability.js and refuse to
# start when their capability is not enabled — structural disable, not a silent
# no-op.
#
# Nothing here contains a credential. `secrets` names the Key Vault secret that
# must exist; the walkthrough prints the command to create it and then verifies
# it resolves. It never prompts for, echoes, or writes a secret value.
#
# Adding a capability is a config change: append an entry, no code edit.

capabilities:

  - id: model
    name: Model backend
    required: true
    summary: >
      The Claude Code backend that every skill runs through. Calls are routed
      via the egress gate (tripwire, tokenize, rehydrate, hash-chained audit).
    enables:
      - All skills (morning, draft, triage, pipeline, people, compliance-report)
      - Webchat responses
      - Digest generation
    without:
      - Castor has no agent. Intake, redaction, and audit still function, but
        nothing can be drafted, triaged, or summarized.
    secrets:
      - name: model-api-key
        description: API key for the model provider (Anthropic direct, or the
          LiteLLM gateway key when routing to OpenRouter).
    setup:
      - Decide the routing path. Direct Anthropic is simplest. LiteLLM in front
        of OpenRouter gives provider choice and matches the Keel gateway setup.
      - |
        Create the secret in Key Vault (replace <vault> and <value>):
          az keyvault secret set --vault-name <vault> --name model-api-key --value <value>
      - If routing through LiteLLM, set ANTHROPIC_BASE_URL to the gateway
        address in the service environment, and pin real model IDs in
        system/model-routing.yaml (the shipped file has placeholders).
    verify: fetch-secret model-api-key

