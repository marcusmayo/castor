# Castor self-contained deployment. Requires castor.env alongside (gitignored),
# created by infra/scripts/bootstrap.sh:
#   OPENROUTER_API_KEY=...     # text skills via the LiteLLM gateway
#   VISION_API_KEY=...         # direct Anthropic key for the interpret path
#   ANTHROPIC_BASE_URL=http://gateway:4000   # claude -p -> gateway (OpenRouter)
name: castor
services:
  webchat:
    image: castor:latest
    # compose can BUILD the image itself -- the cross-platform stranger path (no bash, no sudo):
    #     docker compose --env-file ../versions.lock up -d --build webchat
    # versions.lock stays the single source; the fleet's VM bootstrap still builds via
    # build-image.sh first, so plain `compose up` there never touches this block.
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        BASE_IMAGE: ${UBUNTU_BASE_IMAGE:-}@${UBUNTU_BASE_DIGEST:-}
        NODE_VERSION: ${NODE_VERSION:-}
        NODE_SHA256_X64: ${NODE_SHA256_LINUX_X64:-}
        NODE_SHA256_ARM64: ${NODE_SHA256_LINUX_ARM64:-}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
        TARGETARCH: ${TARGETARCH:-amd64}
    container_name: castor-webchat
    env_file: [castor.env]
    environment:
      CASTOR_BIND: 0.0.0.0       # container netns; host exposure is the ports: line
      AGENT_ROOT: /app
      AGENT_NAME: Castor         # notify label / from-slug (shared-core notify.js reads this)
      NODE_PATH: /app/webchat/node_modules   # scripts/ modules (model-routing.js) resolve js-yaml from webchat deps
      HOME: /home/castor         # claude CLI config dir
      CLAUDE_CONFIG_DIR: /home/castor/.claude   # relocate .claude.json INTO the persistent volume (kills the recreate-warning)
      GATEWAY_CONFIG_PATH: /app/infra/docker/litellm/openrouter.generated.yaml
      ANTHROPIC_SMALL_FAST_MODEL: claude-haiku-4.5   # gateway alias name; unpinned, the CLI sends its dated default and 404s the WebSearch aux-model call
      ANTHROPIC_MODEL: deepseek-v4-pro   # routine-tier default (system/model-routing.yaml); pins the CLI's MAIN model the way SMALL_FAST pins the aux -- bare `claude -p` from tools otherwise sends a dated default the gateway 400s
      WEB_DIRECT_MODEL: claude-sonnet-4-6   # web-ON turns bypass the gateway -> api.anthropic.com for REAL server-side web_search (uses castor's real ANTHROPIC_API_KEY)
      WEB_DIRECT_MODELS: "claude-sonnet-4.6=claude-sonnet-4-6,claude-sonnet-4.5=claude-sonnet-4-6,claude-haiku-4.5=claude-haiku-4-5-20251001,claude-opus-4.8=claude-opus-4-8"   # picker->direct map: web-ON runs the SELECTED model's direct equivalent (all three proven on this key)
    ports:
      - "${CASTOR_PUBLISH_ADDR:-127.0.0.1}:${CASTOR_PUBLISH_PORT:-8443}:8443"
    volumes:                     # image = code; state = volumes (literal split)
      - castor-state:/app/state
      - castor-knowledge:/app/knowledge
      - castor-logs:/app/logs
      - castor-inbox:/app/inbox
      - castor-claude:/home/castor/.claude   # Claude Code session store -> multi-turn memory (persist across recreate)
      # LiteLLM config bind-mounted read-write so `model-routing.js set`
      # regenerates it in place (persists on the host; gateway reads it).
      - ./litellm:/app/infra/docker/litellm
    restart: unless-stopped
  gateway:
    # OPTIONAL: `docker compose --profile gateway up -d`
    # Official image, digest-pinned (see infra/versions.lock). Never pip-installed.
    profiles: ["gateway"]
    image: ghcr.io/berriai/litellm@sha256:9ef6f45bc0104940571765e610c52a1d761b5ec85efcd193795281086ee61277
    container_name: castor-gateway
    env_file: [castor.env]
    command: ["--config", "/cfg/openrouter.generated.yaml", "--port", "4000"]
    volumes:
      - ./litellm:/cfg:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # no host port: reachable only from the compose network (webchat -> gateway)
    restart: unless-stopped

volumes:
  castor-state:
  castor-knowledge:
  castor-logs:
  castor-inbox:
  castor-claude:
