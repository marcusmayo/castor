<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{AGENT_NAME}}</title><style>
body{background:#0d0d0d;color:#ddd;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.box{background:#161616;border:1px solid #262626;border-radius:12px;padding:40px;width:340px;text-align:center}
h1{font-weight:800;margin:0 0 4px;color:#2dd4bf}.sub{color:#888;font-size:14px;margin-bottom:24px}
input{width:100%;box-sizing:border-box;background:#0a0a0a;border:1px solid #2e2e2e;border-radius:8px;color:#2dd4bf;font-size:22px;text-align:center;letter-spacing:6px;padding:16px;margin-bottom:16px}
button{width:100%;background:#0d9488;border:0;border-radius:8px;color:#fff;font-size:16px;padding:14px;cursor:pointer}
.err{color:#e06c6c;font-size:13px;height:18px;margin-top:10px}
</style></head><body>
<div class="box"><h1>{{AGENT_NAME}}</h1><div class="sub">Enter your 6-digit code</div>
<input id="code" inputmode="numeric" maxlength="6" autofocus>
<button onclick="unlock()">Unlock</button><div class="err" id="err"></div></div>
<script>
async function unlock(){
  const token=document.getElementById('code').value.trim();
  const r=await fetch('/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
  if(r.ok){location.href='/';}else{const d=await r.json().catch(()=>({}));document.getElementById('err').textContent=d.error||'invalid code';}
}
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
</script></body></html>
