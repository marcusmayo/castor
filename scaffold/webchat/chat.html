<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{AGENT_NAME}}</title><style>
:root{--accent:#f59e0b;--accent-text:#0a0a0a}
body{background:#0d0d0d;color:#ddd;font-family:system-ui,sans-serif;margin:0;display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #222}
.brand{color:var(--accent);font-weight:800;font-size:18px}
.modelbar{font-size:12px;color:#888;font-family:monospace}
.modelbar b{color:#9ecb9e}.modelbar code{color:var(--accent)}
button.logout{background:#1e1e1e;border:1px solid #2e2e2e;border-radius:6px;color:#aaa;padding:6px 12px;cursor:pointer}
.swatch{width:16px;height:16px;border-radius:50%;background:var(--accent);border:1px solid #444;cursor:pointer;display:inline-block;flex-shrink:0}
#swatches{display:none;gap:10px;padding:10px 16px;border-bottom:1px solid #1a1a1a;align-items:center}
.pswatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid #000;box-shadow:0 0 0 1px #444}
.pswatch:hover{box-shadow:0 0 0 2px var(--accent)}
.cheattoggle{padding:8px 16px;color:var(--accent);cursor:pointer;font-size:14px;border-bottom:1px solid #1a1a1a}
#cheat{padding:8px 16px;border-bottom:1px solid #1a1a1a;display:none}
.cheatgroup{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;margin:4px 0}
.glabel{color:#666;font-size:11px;text-transform:uppercase;letter-spacing:.5px;width:120px;flex-shrink:0;text-align:right;padding-right:6px}
.cheatchip{background:#1e1e1e;border:1px solid #2e2e2e;border-radius:4px;padding:2px 8px;font-family:monospace;font-size:12px;color:var(--accent);cursor:pointer}
.cheatchip:hover{background:#252525}
#log{flex:1;overflow-y:auto;padding:16px;white-space:pre-wrap;font-size:14px;line-height:1.5}
.msg{margin-bottom:14px}.me{color:#9ecb9e}.sys{color:#ccc}.err{color:#e06c6c}.step{color:#777;font-style:italic;font-size:13px}
footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #222}
textarea{flex:1;background:#0a0a0a;border:1px solid #2e2e2e;border-radius:8px;color:#ddd;padding:12px;font-size:14px;resize:none;font-family:inherit}
button.send{background:var(--accent);border:0;border-radius:8px;color:var(--accent-text);padding:0 22px;cursor:pointer}
  .work{margin:6px 0}
  .worktoggle{color:var(--accent);cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;font-size:13px}
  .worktoggle .spinner{width:12px;height:12px;border:2px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .worksteps{display:none;margin-top:6px;padding:8px 12px;background:#141414;border:1px solid #242424;border-radius:8px;color:#9a9a9a;font-family:ui-monospace,monospace;font-size:13px}
  .worksteps.open{display:block}
  .worksteps div{line-height:1.6}
  .modelbar select{font-size:12px;font-family:monospace;background:#262626;color:var(--accent);border:1px solid #444;border-radius:4px;padding:2px 4px;cursor:pointer}

  /* ---- background lane (fleet-core client: scripts/webchat-controls.js) -------------------
     Every default below is the pre-background look, so an agent with no image uploaded
     renders exactly as it did before. body.hasbg is added only once a page image exists. */
  :root{--bg-img:none;--bg-size:cover;--bg-pos:50% 50%;
        --inlay-img:none;--inlay-op:0;--inlay-rot:-6deg;--inlay-scale:1.4;--box-a:0.78}
  body.hasbg{background-image:var(--bg-img);background-size:var(--bg-size);
    background-position:var(--bg-pos);background-repeat:no-repeat;background-attachment:fixed}
  /* The answer boxes ghost the inlay through a pseudo-element rather than a second background
     layer, because a background layer cannot be rotated; inset:-30% keeps the corners covered
     once it is. Children are lifted so text never sits under the ghost. */
  body.hasbg .msg{position:relative;overflow:hidden;background-color:rgba(30,30,30,var(--box-a))}
  body.hasbg .msg::before{content:'';position:absolute;inset:-30%;background-image:var(--inlay-img);
    background-size:cover;background-position:center;opacity:var(--inlay-op);
    transform:rotate(var(--inlay-rot)) scale(var(--inlay-scale));pointer-events:none}
  body.hasbg .msg>*{position:relative;z-index:1}
  /* Light scene -> dark box text. Measured in the browser, not guessed. */
  body.hasbg.lightbg .msg{color:#0a0a0a;background-color:rgba(245,245,245,var(--box-a))}
  body.hasbg.lightbg .msg a{color:#123}
  /* the control */
  #bgPanel{display:none;margin:0;padding:12px 16px;background:#141414;
    border-bottom:1px solid #262626;font-size:12px}
  #bgPanel.on{display:block}
  #bgPanel .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
  #bgPanel label{color:#888;min-width:96px}
  #bgPanel .hint{color:#888;font-size:11px;line-height:1.6}
  #bgPanel input[type=range]{width:130px}
  #bgPanel input[type=file]{color:#bbb;background:#0f0f0f;border:1px solid #2a2a2a;
    border-radius:5px;padding:2px;font:inherit;font-size:11px}
  #bgPanel select{background:#0f0f0f;border:1px solid #2a2a2a;color:#ddd;border-radius:5px;
    padding:3px 8px;font:inherit;font-size:12px}
  #bgPanel button.rst{background:#2a1414;border:1px solid #5a2020;color:#e0a0a0;
    border-radius:5px;padding:3px 10px;cursor:pointer;font:inherit;font-size:11px}
  /* Castor's .msg was a bare block with a bottom margin -- there was no box for an inlay to
     live on. It becomes the same bubble keel already had, which is the visible change here. */
  body.hasbg .msg{max-width:88%;padding:10px 13px;border-radius:10px;border:1px solid #262626}
  /* ---- chrome over the image -------------------------------------------------------------
     Without this, keel's header/skills/composer sit on the page as opaque slabs and cut the
     scene in half, while castor's are fully transparent and drop small text straight onto a
     busy map. Both get the same translucent band. The blur is load-bearing: alpha alone does
     not make 12px type legible over a photograph. Scoped to body.hasbg, so an agent with no
     image uploaded is untouched. */
  body.hasbg header,body.hasbg .cheattoggle,body.hasbg #swatches,body.hasbg footer{
    background-color:rgba(18,18,18,var(--chrome-a,.64));
    -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
  body.hasbg textarea,body.hasbg #input{background-color:rgba(10,10,10,.74)}
  /* A pale scene makes the band MORE opaque; it never inverts. Inverting it was wrong: castor's
     header buttons carry inline style="...color:#aaa", which outranks any stylesheet rule, so a
     light band left them invisible -- and the brand, the model label and the modelbar have fixed
     dim colours that do not flip either. Chrome stays dark by construction, so every colour
     inside it remains valid for any image anyone uploads to any agent, now or later. Only the
     answer boxes flip, because they are the surface actually sitting on the scene. */
  body.hasbg.lightbg header,body.hasbg.lightbg .cheattoggle,body.hasbg.lightbg #swatches,body.hasbg.lightbg footer{--chrome-a:.84}
</style></head><body>
<header>
  <span class="brand">{{AGENT_NAME}}</span>
  <span class="modelbar" id="modelbar">model: …</span>
  <span style="display:flex;align-items:center;gap:10px">
    <button id="newConv" onclick="newConversation()" title="Start a fresh conversation (shared with Aegis - both route sessions reset)" style="background:#1e1e1e;border:1px solid #2e2e2e;border-radius:6px;color:#aaa;padding:6px 12px;cursor:pointer;font-size:13px;margin-right:8px">↻ new</button>
    <button id="webToggle" onclick="toggleWeb()" title="Web research access" style="background:#1e1e1e;border:1px solid #2e2e2e;border-radius:6px;color:#aaa;padding:6px 12px;cursor:pointer;font-size:13px">web: …</button>
    <button onclick="toggleBackground()" title="Set this agent's background image (this agent only)" style="background:#1e1e1e;border:1px solid #2e2e2e;border-radius:6px;color:#aaa;padding:6px 12px;cursor:pointer;font-size:13px">background</button>
    <span class="swatch" id="accentSwatch" onclick="toggleSwatches()" title="accent color (click to change)"></span>
    <button class="logout" onclick="location.href='/logout'">Log out</button>
  </span>
</header>
<div id="bgPanel">
  <div class="hint" id="bgHint">&hellip;</div>
  <div class="row"><label>page image</label>
    <input type="file" id="bgPageFile" accept="image/png,image/jpeg,image/webp">
    <button class="rst" onclick="bgReset('page')">reset all</button></div>
  <div class="row"><label>fit</label>
    <select id="bgFit" onchange="bgSet('page',{fit:this.value})">
      <option value="cover">cover &mdash; fills, crops the overflow</option>
      <option value="contain">contain &mdash; whole image, letterboxed</option>
      <option value="fill">fill &mdash; stretches to fit</option>
    </select></div>
  <div class="row"><label>focal point</label>
    x <input type="range" id="bgPosX" min="0" max="100" oninput="bgSet('page',{posX:+this.value})">
    y <input type="range" id="bgPosY" min="0" max="100" oninput="bgSet('page',{posY:+this.value})">
    <span class="hint">only bites on <b>cover</b>, which is the one that crops</span></div>
  <div class="row"><label>inlay image</label>
    <input type="file" id="bgInlayFile" accept="image/png,image/jpeg,image/webp">
    <button class="rst" onclick="bgReset('inlay')">reset inlay</button>
    <span class="hint">optional &mdash; with none, the answer boxes ghost the page image</span></div>
  <div class="row"><label>inlay look</label>
    opacity <input type="range" id="bgOp" min="0" max="60" oninput="bgSet('inlay',{opacity:this.value/100})">
    angle <input type="range" id="bgRot" min="-30" max="30" oninput="bgSet('inlay',{rotate:+this.value})">
    scale <input type="range" id="bgScale" min="60" max="260" oninput="bgSet('inlay',{scale:this.value/100})"></div>
</div>

<div id="swatches"></div>
<div class="cheattoggle" onclick="toggleCheat()"><span id="caret">▸</span> Skills</div>
<div id="cheat">
  <div class="cheatgroup"><span class="glabel">Briefing</span>
    <code class="cheatchip" onclick="ins('/morning')" title="daily briefing: deadlines, pipeline, overnight intake">/morning</code>
    <code class="cheatchip" onclick="ins('/pipeline')" title="portfolio status by stage (read-only)">/pipeline</code>
    <code class="cheatchip" onclick="ins('/compliance-report')" title="nine-point posture report">/compliance-report</code></div>
  <div class="cheatgroup"><span class="glabel">Capture</span>
    <code class="cheatchip" onclick="ins('/triage')" title="process inbox: classify, propose actions (confirm to apply)">/triage</code><code class="cheatchip" onclick="ins('/queue')" title="deterministic queue listing (drop awaiting intake)">/queue</code><code class="cheatchip" onclick="ins('/queue-clear')" title="archive all queued items locally (no egress)">/queue-clear</code></div>
  <div class="cheatgroup"><span class="glabel">People</span>
    <code class="cheatchip" onclick="ins('/people ')" title="stakeholder lookup (read-only)">/people</code>
    <code class="cheatchip" onclick="ins('/draft ')" title="draft a message in your voice (never sends)">/draft</code></div>
  <div class="cheatgroup"><span class="glabel">Appearance</span>
    <code class="cheatchip" onclick="ins('/color ')" title="set the UI accent color (per agent)">/color</code></div>
</div>
<div class="cheattoggle" onclick="togglePending()"><span id="pcaret">▸</span> Pending <span id="pcount" style="color:#666;font-size:12px"></span></div>
<div id="pending" style="display:none;padding:8px 16px;border-bottom:1px solid #1a1a1a;font-size:13px"></div>
<div id="log"></div>
<footer>
  <textarea id="input" rows="1" placeholder="Ask {{AGENT_NAME}}… (e.g. /morning, or paste a note for /triage)"></textarea>
  <button class="send" onclick="send()">Send</button>
</footer>
<script src="/core/webchat-controls.js"></script>
<script>
const log=document.getElementById('log');
function add(text,cls){const d=document.createElement('div');d.className='msg '+(cls||'sys');d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
let workStepsEl=null, workLabel=null, workSpinner=null, workTimer=null, workSec=0;
function startTurn(){
  const work=document.createElement('div'); work.className='work';
  const toggle=document.createElement('div'); toggle.className='worktoggle';
  const spin=document.createElement('div'); spin.className='spinner'; workSpinner=spin;
  workLabel=document.createElement('span'); workSec=0; workLabel.textContent='Castor is working\u2026 0s  (show steps)';
  toggle.appendChild(spin); toggle.appendChild(workLabel);
  workStepsEl=document.createElement('div'); workStepsEl.className='worksteps';
  toggle.onclick=()=>workStepsEl.classList.toggle('open');
  work.appendChild(toggle); work.appendChild(workStepsEl);
  log.appendChild(work); log.scrollTop=log.scrollHeight;
  current=null;
  workTimer=setInterval(()=>{ workSec++; if(workLabel) workLabel.textContent='Castor is working\u2026 '+workSec+'s  (show steps)'; },1000);
}
function addStep(text){ if(!workStepsEl) return; const d=document.createElement('div'); d.textContent='\u203a '+text; workStepsEl.appendChild(d); log.scrollTop=log.scrollHeight; }
function appendToken(text){ if(!current){ current=document.createElement('div'); current.className='msg sys'; log.appendChild(current); } current.textContent+=text; log.scrollTop=log.scrollHeight; }
function finishWork(){
  if(workTimer){ clearInterval(workTimer); workTimer=null; }
  if(workLabel){ workLabel.textContent='Done in '+workSec+'s  (show steps)'; }
  if(workSpinner){ workSpinner.style.animation='none'; workSpinner.style.borderTopColor='#3a7a3a'; workSpinner=null; }
  if(current && !current.textContent.trim()){ current.remove(); }
}
function ins(cmd){const i=document.getElementById('input');i.value=cmd;i.focus();}
let PALETTE={};
function applyAccent(hex){document.documentElement.style.setProperty('--accent',hex);const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);document.documentElement.style.setProperty('--accent-text',(0.299*r+0.587*g+0.114*b)/255>0.6?'#0a0a0a':'#fff');}
fetch('/color').then(r=>r.json()).then(d=>{if(d.ok){PALETTE=d.palette||{};applyAccent(d.accent);renderSwatches();}}).catch(()=>{});
function renderSwatches(){const el=document.getElementById('swatches');if(!el)return;let h='';for(const k in PALETTE){h+='<span class="pswatch" title="'+k+'" onclick="pickColor(\''+PALETTE[k]+'\')" style="background:'+PALETTE[k]+'"></span>';}el.innerHTML=h;}
function toggleSwatches(){const el=document.getElementById('swatches');el.style.display=(el.style.display==='flex')?'none':'flex';}
async function pickColor(hex){try{const r=await (await fetch('/color',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:hex})})).json();if(r.ok){applyAccent(r.accent);}}catch(e){}}
async function handleColor(cmd){const arg=cmd.slice(6).trim();add(cmd,'me');if(!arg){add('Colors: '+Object.keys(PALETTE).join(', ')+' - or a #rrggbb hex. Usage: /color amber','sys');return;}try{const r=await (await fetch('/color',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:arg})})).json();if(r.ok){applyAccent(r.accent);add('Accent set to '+r.accent,'sys');}else{add('Unknown color. Options: '+Object.keys(r.palette||PALETTE).join(', ')+' or a #rrggbb hex.','err');}}catch(e){add('Color change failed: '+e,'err');}}
function toggleCheat(){const c=document.getElementById('cheat');const open=c.style.display==='block';c.style.display=open?'none':'block';document.getElementById('caret').textContent=open?'▸':'▾';}

// Model picker + web-research toggle are single-sourced in fleet-core
// (scripts/webchat-controls.js, hash-verified, served at /core/webchat-controls.js and
// loaded by the script tag above). add is this page's message renderer -> notify adapter.
ChatControls.init({ notify: add });

let ws, streaming=false, current=null;
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onmessage=(e)=>{const ev=JSON.parse(e.data);
  if(ev.type==='start'){startTurn();streaming=true;}
  else if(ev.type==='token'){appendToken(ev.text);}
  else if(ev.type==='step'){addStep(ev.text);}
  else if(ev.type==='error'){finishWork();add(ev.text,'err');}
  else if(ev.type==='done'){finishWork();streaming=false;}
  };
  ws.onclose=()=>{setTimeout(connect,1500);};
}
connect();
function send(){
  const i=document.getElementById('input');const prompt=i.value.trim();
  if(!prompt)return;
  if(prompt.toLowerCase().startsWith('/color')){i.value='';handleColor(prompt);return;}
  if(streaming||ws.readyState!==1)return;
  add(prompt,'me');i.value='';
  ws.send(JSON.stringify({prompt}));
}
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
// --- Pending panel: intake items by state, with interpret for vision-pending ---
async function loadPending(){
  const el=document.getElementById('pending');
  try{
    const d=await (await fetch('/pending')).json();
    if(!d.ok){el.textContent='pending unavailable';return;}
    const g=d.groups;
    const total=g.ready.length+g.flagged.length+g.unscanned.length+g.visionPending.length+((g.awaitingIntake||[]).length);
    document.getElementById('pcount').textContent=total?('('+total+')'):'(0)';
    let h='';
    function group(title,items,extra){
      if(!items.length)return '';
      let s='<div style="margin:6px 0"><span style="color:#888;text-transform:uppercase;font-size:11px">'+title+' ('+items.length+')</span>';
      for(const it of items){ s+='<div style="margin:3px 0 3px 8px;font-family:monospace">'+it.file+(extra?extra(it):'')+'</div>'; }
      return s+'</div>';
    }
    h+=group('Awaiting intake', g.awaitingIntake||[], ()=>' <span style="color:#888;font-size:11px">&mdash; intake sweeps every 2 min</span>');
    h+=group('Vision-pending', g.visionPending, it=>' <button onclick="interpret(\''+it.file+'\',\''+(it.sha256||'')+'\')" style="background:var(--accent);border:0;border-radius:4px;color:var(--accent-text);font-size:11px;padding:1px 8px;cursor:pointer">Interpret</button>');
    h+=group('Ready', g.ready, ()=>' <span style="color:#666;font-size:11px">— run /triage</span>');
    h+=group('Flagged', g.flagged, ()=>' <span style="color:#e0a86c;font-size:11px">⚑ flagged</span>');
    h+=group('Unscanned', g.unscanned, ()=>' <span style="color:#888;font-size:11px">not scannable as text</span>');
    el.innerHTML=h||'<span style="color:#666">inbox empty</span>';
  }catch(e){el.textContent='pending unavailable';}
}
function togglePending(){const p=document.getElementById('pending');const open=p.style.display==='block';p.style.display=open?'none':'block';document.getElementById('pcaret').textContent=open?'▸':'▾';if(!open)loadPending();}
async function interpret(name,sha){
  if(!confirm('Send this image to the vision model for interpretation?\n\n'+name+'\n\nThis is the one place a raw image leaves the machine. Confirm to attest and send.'))return;
  add('Interpreting '+name+' (attested vision)…','step');
  try{
    const r=await (await fetch('/pending/interpret',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,sha256:sha})})).json();
    if(r.ok){add('Interpretation of '+name+':','sys');add(r.text,'sys');loadPending();}
    else{add('Interpret failed: '+r.error,'err');}
  }catch(e){add('Interpret failed: '+e,'err');}
}
loadPending();

</script></body></html>
