# Castor skill/pipeline registry -- VALUES only. The invocation MECHANISM (auth, spawn,
# timeout, error shape, record-to-state) is fleet-core scripts/skills.js. record: persists
# each result to state/compliance/<record>.json for the /compliance-report skill to read.
skills:
  - route: /queue
    bin: node
    args: [scripts/queue.js]
    timeout: 15000
    category: Intake
  - route: /run-audit-verify
    bin: node
    args: [scripts/audit-log.js, verify]
    timeout: 30000
    record: audit-verify
    category: Governance
  - route: /run-capability-status
    bin: node
    args: [scripts/setup-wizard.js, --status]
    timeout: 30000
    record: capability-status
    category: Governance
  - route: /run-scan-tree
    bin: node
    args: [scripts/scan-tree.js, .]
    timeout: 60000
    category: Governance
  - route: /run-check-net
    bin: node
    args: [scripts/compliance-checks.js, net-ingress]
    timeout: 15000
    record: net-ingress
    category: Governance
  - route: /run-check-auth
    bin: node
    args: [scripts/compliance-checks.js, edge-auth]
    timeout: 15000
    record: edge-auth
    category: Governance
  - route: /run-check-pii
    bin: node
    args: [scripts/compliance-checks.js, pii]
    timeout: 15000
    record: pii-redaction
    category: Governance
  - route: /run-check-backup
    bin: node
    args: [scripts/compliance-checks.js, backup]
    timeout: 15000
    record: backup
    category: Governance
  - route: /run-check-pause
    bin: node
    args: [scripts/compliance-checks.js, fleet-pause]
    timeout: 15000
    record: fleet-pause
    category: Governance
  - route: /run-check-vuln
    bin: node
    args: [scripts/compliance-checks.js, vuln]
    timeout: 60000
    record: vuln-audit
    category: Governance
  - route: /run-check-secrets
    bin: node
    args: [scripts/compliance-checks.js, secrets]
    timeout: 90000
    record: secret-scan
    category: Governance
