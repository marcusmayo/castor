# Fleet backup values for this agent (mechanism: fleet-core backup-push.sh).
# paths   -- repo-relative dirs to include (rarely needed; state lives in volumes)
# volumes -- docker named volumes to include
# containers -- restarted after a restore
paths: []
volumes:
  - castor_castor-state
  - castor_castor-knowledge
  - castor_castor-logs
  - castor_castor-inbox
  - castor_castor-claude
containers:
  - castor-webchat
  - castor-gateway
