# Castor runtime adds poppler-utils (pdftotext), tesseract-ocr (OCR), gzip
# (log-rotate) from the Ubuntu repo — versioned by the pinned base image digest.
# Node deps pinned by package-lock.json in the repo root, gate/, and webchat/
# (integrity enforced by npm ci). No Python pip deps: the only Python script
# (sunday-maintenance.py) is stdlib-only.
# LiteLLM gateway (OPTIONAL, --profile gateway). Official proxy image ONLY --
# never `pip install litellm`. Same pin as Keel, verified 2026-07-14.
LITELLM_IMAGE=ghcr.io/berriai/litellm
LITELLM_DIGEST=sha256:9ef6f45bc0104940571765e610c52a1d761b5ec85efcd193795281086ee61277
